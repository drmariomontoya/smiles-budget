<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--gold:#C9A84C;--gold-l:#E8D08A;--gold-d:#7A6230;--ink:#0E0D0B;--ink2:#1A1916;--ink3:#2A2820;--border:rgba(201,168,76,0.18);--border-s:rgba(201,168,76,0.4);--t1:#F7F5F0;--t2:#9E9A8A;--t3:#6B6655;--r:10px;--rl:14px;--ok:#6DBF82;--warn:#E8B84C;--danger:#E86A4C;--info:#69A6DB;--brecha:#A78BFA;}
html,body{height:100%;min-height:100vh}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--t1);font-size:15px;line-height:1.5;min-height:100vh}
#loading-screen{position:fixed;inset:0;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;gap:16px}
#loading-screen .brand{font-family:'DM Serif Display',serif;font-size:24px;color:var(--gold)}
#loading-screen .sub{font-size:12px;color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
.loader{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;border-bottom:1px solid var(--border);background:var(--ink);position:sticky;top:0;z-index:50}
.brand{font-family:'DM Serif Display',serif;font-size:20px;color:var(--gold);letter-spacing:.02em}
.sub{font-size:11px;color:var(--t2);letter-spacing:.1em;text-transform:uppercase;margin-top:2px}
.budget-pill{font-size:12px;border:1px solid var(--border-s);border-radius:20px;padding:6px 16px;color:var(--gold-d);letter-spacing:.05em}
.budget-pill span{color:var(--gold);font-weight:500}
.status-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.layout{display:flex;min-height:calc(100vh - 61px)}
.sidebar{width:220px;flex-shrink:0;border-right:1px solid var(--border);background:var(--ink2);padding:24px 0;position:sticky;top:61px;height:calc(100vh - 61px);overflow-y:auto}
.sidebar-section{margin-bottom:28px}
.sidebar-label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold-d);font-weight:500;padding:0 20px;margin-bottom:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:13px;color:var(--t3);cursor:pointer;transition:all .15s;border-left:2px solid transparent;user-select:none}
.nav-item i{font-size:16px;flex-shrink:0}
.nav-item:hover{color:var(--gold-l);background:rgba(201,168,76,.05)}
